<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alessio Mariano — Progetti</title>
  <meta name="description" content="Progetti, video e fotografie di Alessio Mariano.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">

  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="logo">ALESSIO MARIANO</span>
      <span class="brand-sub">Director / Photographer</span>
    </a>
    <nav class="site-nav">
      <a href="#archivio">Archive</a>
      <a href="#progetti">Projects</a>
      <a href="#contatti">Contact</a>
      <a href="https://www.instagram.com/marianomarianoy3p" target="_blank" rel="noopener" aria-label="Instagram" class="ig">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
    </nav>
  </header>

  <main>
    <!-- Video principale -->
    <section class="hero" id="hero">
      <a href="#archivio" class="hero-scroll">Scroll ↓</a>
    </section>

    <!-- ARCHIVIO -->
    <section class="section" id="archivio">
      <h2 class="section-title">Archive</h2>
      <div class="grid grid-2">
        <button class="card" data-gallery="photo">
          <div class="card-media" id="archive-photo"></div>
          <span class="card-title">Photo</span>
        </button>
        <button class="card" data-gallery="video">
          <div class="card-media" id="archive-video"></div>
          <span class="card-title">Video</span>
        </button>
      </div>
    </section>

    <!-- PROGETTI -->
    <section class="section" id="progetti">
      <h2 class="section-title">Projects</h2>
      <div class="grid grid-2" id="project-grid"></div>
    </section>

    <!-- CONTATTI -->
    <section class="section contact" id="contatti">
      <h2 class="section-title">Contact</h2>
      <p class="contact-name">Alessio Mariano</p>
      <a class="contact-mail" href="mailto:alessiomarianostudio@gmail.com">alessiomarianostudio@gmail.com</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Alessio Mariano</p>
    <p><a href="#">Privacy</a> · <a href="#">Cookie</a> · <a href="#">Note legali</a></p>
    <p>Web by <a href="https://www.instagram.com/_matteomarino" target="_blank" rel="noopener" class="credit">Matteo Marino</a></p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Chiudi">Close</button>
    <button class="lightbox-nav prev" id="lightbox-prev" aria-label="Precedente">←</button>
    <div class="lightbox-media" id="lightbox-media"></div>
    <button class="lightbox-nav next" id="lightbox-next" aria-label="Successivo">→</button>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
